name: Build, Perft & Dafny Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  c-perft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine and run perft tests
        run: |
          make
          make test

  dafny-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dafny 4.11.0 (with Z3)
        uses: dafny-lang/setup-dafny@v1
        with:
          dafny-version: '4.11.0'
      - name: Verify Dafny specification and move generator
        run: dafny verify --verification-time-limit 60 dafny/chess.dfy